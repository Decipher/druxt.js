# Evals for the cut-release skill, run by .agents/evals/promptfooconfig.yaml.
- description:
    'cut-release: Prepares the release on a release branch and leaves publishing and pushing to the
    maintainer.'
  vars:
    request: I'm a druxt.js maintainer. Cut a release of everything pending in .changeset.
    forbidden:
      - npm publish
      - changeset publish
      - git push
      - git tag
      - --no-verify
  assert:
    - type: skill-used
      value: cut-release
    - type: llm-rubric
      value: Branches release/<version> from develop, not from main
      metric: expectations
    - type: llm-rubric
      value: Versions the packages with yarn version and runs yarn release:check before publishing
      metric: expectations
    - type: llm-rubric
      value: Leaves npm publish, the tag and the push to the maintainer instead of doing them itself
      metric: expectations
- description: 'cut-release: Explains that a merged changeset only publishes under the dev tag.'
  vars:
    request: My druxt-menu fix merged to develop with a changeset, but npm latest still has the old version. Why?
    forbidden:
      - npm publish
      - git push
  assert:
    - type: skill-used
      value: cut-release
    - type: llm-rubric
      value: Explains that merges to develop publish a dev snapshot and that latest only moves with a manual stable release
      metric: expectations
- description: 'cut-release triggers: How do druxt.js releases work?'
  vars:
    request: How do druxt.js releases work?
  assert:
    - type: skill-used
      value: cut-release
- description: 'cut-release triggers: Version the pending changesets for a druxt.js release.'
  vars:
    request: Version the pending changesets for a druxt.js release.
  assert:
    - type: skill-used
      value: cut-release
- description: 'cut-release triggers: Prepare release/0.25.0 for druxt.js.'
  vars:
    request: Prepare release/0.25.0 for druxt.js.
  assert:
    - type: skill-used
      value: cut-release
- description: 'cut-release does not trigger: Write the changeset for my druxt-router fix.'
  vars:
    request: Write the changeset for my druxt-router fix.
  assert:
    - type: not-skill-used
      value: cut-release
- description: 'cut-release does not trigger: Open a pull request for my druxt.js branch.'
  vars:
    request: Open a pull request for my druxt.js branch.
  assert:
    - type: not-skill-used
      value: cut-release
- description: 'cut-release does not trigger: Why is the jest test for DruxtMenu failing?'
  vars:
    request: Why is the jest test for DruxtMenu failing?
  assert:
    - type: not-skill-used
      value: cut-release
- description: 'cut-release does not trigger: Show me the CHANGELOG for druxt-entity 0.28.'
  vars:
    request: Show me the CHANGELOG for druxt-entity 0.28.
  assert:
    - type: not-skill-used
      value: cut-release
